# exito.com, larepublica.co, semana.com y trends.google.com devolvieron
# EGRESS_BLOCKED al intentar fetch directo desde este entorno. La
# información de esas fuentes se obtuvo vía resultados de búsqueda
# (snippets indexados) y se marca access_status=blocked en sources.json,
# nunca como si se hubiera leído la página completa.
