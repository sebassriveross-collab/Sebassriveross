# Estructura genérica de un Debrief de marca.
# Reutilizable para cualquier marca: el document_builder simplemente recorre
# esta lista y busca research/<brand>/sections/<id>_<slug>.md para cada una.
# Para adaptar el debrief a otra marca/categoría no hay que tocar el código,
# solo (si se quiere) este archivo o uno alternativo referenciado desde
# config/brands/<brand>.yaml -> structure_file.

